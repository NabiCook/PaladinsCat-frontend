name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Full-history credential boundary
        timeout-minutes: 3
        run: |
          python3 -B scripts/security/test_full_history_credential_boundary.py
          python3 -B scripts/security/full_history_credential_boundary.py --repository .

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency security regression tests
        timeout-minutes: 2
        run: node --test scripts/security-dependencies.test.mjs scripts/security-braces.test.mjs scripts/security-braces-backport.test.mjs

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Authentication synchronization tests
        timeout-minutes: 2
        run: node --test lib/auth-session-sync.test.mjs lib/auth-challenge.test.mjs lib/auth-session-read.test.mjs lib/auth-credentials.test.mjs lib/server-api.test.mjs

      - name: Player profile render tests
        timeout-minutes: 2
        run: node --test lib/player-profile-response.test.mjs lib/player-profile-server.test.mjs scripts/player-profile-render.test.mjs scripts/player-profile-acquisition.test.mjs

      - name: OIDC transport, login and callback compatibility tests
        timeout-minutes: 3
        run: |
          python3 -m pip install --disable-pip-version-check Send2Trash==2.1.0
          npm run test:oidc
          npm run test:oidc-callback
          npm run test:operator

      - name: Public and Pro surface enforcement tests
        timeout-minutes: 2
        run: node --test lib/pro-surface.test.mjs lib/website-proxy.test.mjs

      - name: Test API namespace and match export authorization
        run: npm run test:api-namespace && npm run test:match-images

      - name: Operations security tests
        run: npm run test:operations

      - name: Anonymous presence privacy tests
        run: npm run test:anonymous-presence

      - name: Champion page request tests
        run: npm run test:champion-page

      - name: Performance page cache tests
        run: node --test lib/performance-page-data.test.mjs

      - name: Build
        run: npm run build

      - name: Install Chromium for auth UI tests
        run: npx playwright install --with-deps chromium

      - name: Auth UI browser tests
        env:
          PALADINSCAT_WEBSITE_GATE_SECRET_FILE: ${{ runner.temp }}/auth-ui-gate-key
          PALADINSCAT_PUBLIC_ORIGIN: http://127.0.0.1:3100
        run: |
          # Exercise the production gate with a disposable test-only signing key.
          node -e "require('node:fs').writeFileSync(process.env.PALADINSCAT_WEBSITE_GATE_SECRET_FILE, require('node:crypto').randomBytes(32).toString('hex'), { mode: 0o600 })"
          trap 'rm -f -- "$PALADINSCAT_WEBSITE_GATE_SECRET_FILE"' EXIT
          npm run test:ui:auth
