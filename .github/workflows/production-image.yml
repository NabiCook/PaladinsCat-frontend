name: Production image

on:
  workflow_dispatch:
    inputs:
      platform_revision:
        description: Exact published platform main commit owning the build and scan gates
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-image-frontend
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main' && github.repository == 'NabiCook/PaladinsCat-frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PLATFORM_REVISION: ${{ inputs.platform_revision }}
    steps:
      - name: Validate the immutable platform coordinate
        run: python3 -c "import os,re; assert re.fullmatch('[a-f0-9]{40}',os.environ['PLATFORM_REVISION'])"
      - name: Checkout the exact component and locales
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          path: paladinscat-frontend
          persist-credentials: false
      - name: Checkout the exact private platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NabiCook/PaladinsCat-platform
          ref: ${{ inputs.platform_revision }}
          fetch-depth: 0
          path: paladinscat-platform
          ssh-key: ${{ secrets.PRODUCTION_PLATFORM_READ_KEY }}
          # Fresh-main verification needs this read-only key until post-job cleanup.
          # Build contexts are credential-free committed-source exports.
          persist-credentials: true
      - name: Resolve the committed resource pin
        id: resources
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          lock=json.loads(Path('paladinscat-frontend/frontend-images.lock.json').read_text())
          assert lock['repository']=='NabiCook/paladinscat-frontend-images'
          assert re.fullmatch('[a-f0-9]{40}',lock['commit'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('commit='+lock['commit']+'\n')
          PY
      - name: Checkout only the pinned private image resources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NabiCook/paladinscat-frontend-images
          ref: ${{ steps.resources.outputs.commit }}
          path: paladinscat-frontend-images
          ssh-key: ${{ secrets.FRONTEND_IMAGES_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install matching Node and render-gate dependency
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python3 -m pip install --disable-pip-version-check Send2Trash==2.1.0
      - name: Build, verify the image-bound render contract, scan and package
        timeout-minutes: 65
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I -B paladinscat-platform/scripts/production_image.py --service frontend --platform-revision "$PLATFORM_REVISION"
      - name: Publish the source-bound production artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-image-frontend-${{ github.sha }}
          path: ${{ runner.temp }}/production-image/artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain scan, SBOM and render evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-image-evidence-frontend-${{ github.sha }}
          path: ${{ runner.temp }}/production-image/evidence/
          if-no-files-found: ignore
          retention-days: 7
